server:
  port: 8080

spring:
  application:
    name: psp-core-service
  
  datasource:
    # Using Docker service name for database connection within the container
    url: jdbc:postgresql://psp-core-db:5432/psp_core_db
    username: postgres
    password: super
  
  jpa:
    hibernate:
      ddl-auto: update # Ovo će automatski kreirati tabele u bazi na osnovu Java klasa
    show-sql: true # Da vidimo u konzoli šta Hibernate radi
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect